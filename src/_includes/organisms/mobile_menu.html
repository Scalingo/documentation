<div id="mobile-navigation" class="fixed inset-x-0 top-0 z-20 flex flex-col xl:hidden">
  {% include organisms/mobile_banner.html %}
  <div id="mobile-menu-panels" class="hidden min-h-0 flex-1 bg-sc-gray-5 text-sc-black-1">
    <div class="flex h-full flex-col">
      <div class="min-h-0 flex-1 overflow-y-auto">
        <nav aria-label="Site sections" class="flex flex-wrap gap-x-4 gap-y-1 border-b border-sc-gray-3 px-6 py-3">
          {% include organisms/navigation/sections.html %}
        </nav>
        <div id="mobile-nav-container"></div>
      </div>
      <div class="flex h-20 shrink-0 items-center justify-center gap-10 border-t border-sc-gray-3">
        <a href="https://auth.scalingo.com/users/sign_in" class="hover:text-primary-orange-400">Sign In</a>
        <div>
          {% include atoms/button.html href="https://auth.scalingo.com/users/sign_up" text="Sign up" %}
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const mobileNavigation = document.getElementById('mobile-navigation');
  const mobileMenuButton = document.getElementById('mobile-menu');

  function setMobileMenuOpen(open) {
    const navContainer = document.getElementById(open ? 'mobile-nav-container' : 'full-nav-container');
    navContainer.appendChild(document.getElementById('menu-nav'));

    mobileMenuButton.setAttribute('aria-expanded', String(open));
    mobileNavigation.classList.toggle('h-dvh', open);
    document.getElementById('mobile-menu-panels').classList.toggle('hidden', !open);
    document.getElementById('mobile-menu-icon-cross').classList.toggle('hidden', !open);
    document.getElementById('mobile-menu-icon-hamburger').classList.toggle('hidden', open);
    document.getElementById('content').classList.toggle('hidden', open);
  }

  mobileMenuButton.addEventListener('click', () => {
    setMobileMenuOpen(mobileMenuButton.getAttribute('aria-expanded') === 'false');
  });

  window.addEventListener('resize', () => {
    if (mobileMenuButton.getAttribute('aria-expanded') === 'true' && mobileNavigation.offsetWidth === 0) {
      setMobileMenuOpen(false);
    }
  });
</script>
